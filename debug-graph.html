<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #1e1e1e;
                color: #fff;
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            header {
                display: flex;
                gap: 8px;
                padding: 12px;
                background: #252526;
                border-bottom: 1px solid #3c3c3c;
                align-items: center;
            }
            main {
                flex: 1;
                position: relative;
                overflow: hidden;
            }
            #graph {
                width: 100%;
                height: 100%;
                display: block;
                cursor: grab;
            }
            #emptyState {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                opacity: 0.6;
            }
            #status {
                margin-left: auto;
            }
        </style>
    </head>
    <body>
        <header>
            <button id="chooseVault">Choose vault</button>
            <button id="refresh">Refresh</button>
            <button id="fit">Fit graph</button>
            <button id="settingsButton">Settings</button>
            <span id="status">No vault selected</span>
        </header>
        <main>
            <div id="graph"></div>
            <p id="emptyState">Loading graph...</p>
        </main>
        <aside id="settings" hidden>
            <div class="settings-header">
                <strong>Graph settings</strong
                ><button id="closeSettings">← Back to graph</button>
            </div>
            <section>
                <h2>Filters</h2>
                <input
                    id="search"
                    type="search"
                    placeholder="Search files" /><label
                    ><input id="existing" type="checkbox" /> Existing files
                    only</label
                ><label
                    ><input id="orphans" type="checkbox" checked /> Show
                    orphans</label
                >
            </section>
            <section>
                <h2>Display</h2>
                <label
                    ><input id="labels" type="checkbox" checked /> Show
                    labels</label
                ><label
                    >Node size<input
                        id="nodeSize"
                        type="range"
                        min="50"
                        max="180"
                        value="100" /></label
                ><label
                    >Link thickness<input
                        id="linkWidth"
                        type="range"
                        min="50"
                        max="250"
                        value="100"
                /></label>
            </section>
            <section>
                <h2>Forces</h2>
                <label
                    >Center force<input
                        id="centerForce"
                        type="range"
                        min="0"
                        max="100"
                        value="28" /></label
                ><label
                    >Repel force<input
                        id="repelForce"
                        type="range"
                        min="20"
                        max="180"
                        value="85" /></label
                ><label
                    >Link distance<input
                        id="linkDistance"
                        type="range"
                        min="40"
                        max="220"
                        value="100"
                /></label>
            </section>
            <button id="reset">Restore default settings</button>
        </aside>
        <script>
            window.acquireVsCodeApi = () => ({
                postMessage: (msg) => console.log("vscode-post", msg),
            });
            window.addEventListener("error", (e) => {
                console.log(
                    "window-error",
                    e.message,
                    e.filename,
                    e.lineno,
                    e.colno,
                    e.error && e.error.stack,
                );
            });
            window.addEventListener("unhandledrejection", (e) => {
                console.log(
                    "unhandledrejection",
                    (e.reason && e.reason.stack) || e.reason,
                );
            });
        </script>
        <script src="/media/pixi.min.js"></script>
        <script src="/media/d3.min.js"></script>
        <script src="/media/graph.js"></script>
        <script>
            window.addEventListener("message", (event) => {
                console.log("msg-event", event.data);
            });
            const sample = {
                type: "graph",
                vaultPath: "/tmp/demo",
                graph: {
                    nodes: [
                        {id: "a.md", label: "a", missing: false},
                        {id: "b.md", label: "b", missing: false},
                    ],
                    edges: [{source: "a.md", target: "b.md"}],
                },
            };
            setTimeout(() => {
                window.dispatchEvent(
                    new MessageEvent("message", {data: sample}),
                );
            }, 300);
        </script>
    </body>
</html>
